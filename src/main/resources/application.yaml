server:
  # Tomcat reads X-Forwarded-For only from trusted proxies (server.tomcat.remoteip.internal-proxies, private networks by default).
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        # Exposes only /actuator/health and its liveness and readiness groups.
        include: health
  endpoint:
    health:
      probes:
        # Serves /actuator/health/liveness and /actuator/health/readiness also outside Kubernetes.
        enabled: true
      group:
        readiness:
          # The pod is ready only when it accepts traffic and has the DB-IP Lite file loaded.
          include: readinessState,dbIpDatabase
  otlp:
    metrics:
      export:
        # The metrics backend on prod is not known yet. The dev profile turns the export on.
        enabled: false

spring:
  application:
    name: empik
  datasource:
    hikari:
      # Maximum time in milliseconds a request waits for a free connection from the pool (default 30000).
      connection-timeout: 2000
      # Postgres cancels any SQL statement that runs longer than 5s, also while it waits for the lock on a coupon row.
      # Liquibase uses the same connections, so a migration statement must also finish within 5s.
      connection-init-sql: SET statement_timeout = '5s'
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yml

coupons:
  db:
    constraints:
      # Name of the unique constraint on coupon.code, defined in 0002-create-coupon.sql.
      coupon-code-unique: uq_coupon_code
      # Name of the unique constraint on coupon_usage (coupon_id, user_id), defined in 0003-create-coupon-usage.sql.
      coupon-usage-coupon-user-unique: uq_coupon_usage_coupon_user
  geoip:
    # Directory with the DB-IP Lite file. The application needs write access to it.
    directory: geoip
    download:
      enabled: true
      base-url: https://download.db-ip.com/free
      timeout: 60s
      # Daily check in UTC. A download happens only when the file of the current month is missing.
      cron: "0 0 4 * * *"
